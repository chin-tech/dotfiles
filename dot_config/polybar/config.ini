; ==============================================================================
# Polybar Config - Migrated from i3bar & i3status-rs
# ==============================================================================

[colors]
# Base Theme Palette (Rose-Slate / Dark Navy)
bg              = #0e1722
fg              = #c2c5c7
sep             = #5e6772
border          = #5e6772

# Workspace Colors
ws-active-bg    = #5e6772
ws-active-fg    = #c2c5c7
ws-inactive-fg  = #95827D
ws-urgent-bg    = #B9625C
ws-urgent-fg    = #0e1722

# Module Overrides (Derived from your i3status-rs theme overrides)
; net-bg          = #015c50
net-bg          = #0E380F
net-fg          = #7de8d0
cpu-bg          = #012a47
cpu-fg          = #7ab8e8
disk-bg         = #011f3a
disk-fg         = #8ab4d4
mem-bg          = #06162e
mem-fg          = #7a9cc9
sound-bg        = #0d1f3c
sound-fg        = #a0bedd
bt-bg           = #0a1a38
bt-fg           = #7a9cc9
bat-bg          = #011f4b
bat-fg          = #4ecba0
time-bg         = #011f4b
; time-fg         = #ff992f
time-fg         = #B9625C
alert-bg        = #6b1a1a
alert-fg        = #f4a261

[bar/main]
bottom = true
width = 100%
height = 20pt
radius = 0

monitor = ${env:MONITOR:}

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2pt
padding-left = 0
padding-right = 1
module-margin = 0

# --- Font Specifications (Migrated from i3 config) ---
font-0 = "Monaspace Radon NF:style=Regular:size=9;2"
font-1 = "Font Awesome 6 Free:style=Solid:size=15;2"
font-2 = "Font Awesome 6 Brands:style=Solid:size=15;2"

modules-left = i3
modules-right = net cpu disk memory pulseaudio bluetooth battery date

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

# ==============================================================================
# MODULE DEFINITIONS
# ==============================================================================

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true

# Active Workspace
label-focused = %index%
label-focused-background = ${colors.ws-active-bg}
label-focused-foreground = ${colors.ws-active-fg}
label-focused-padding = 1

# Inactive Workspace
label-unfocused = %index%
label-unfocused-background = ${colors.bg}
label-unfocused-foreground = ${colors.ws-inactive-fg}
label-unfocused-padding = 1

# Visible Workspace (other monitors)
label-visible = %index%
label-visible-background = ${colors.bg}
label-visible-foreground = ${colors.fg}
label-visible-padding = 1

# Urgent Workspace
label-urgent = %index%
label-urgent-background = ${colors.ws-urgent-bg}
label-urgent-foreground = ${colors.ws-urgent-fg}
label-urgent-padding = 1

# --- Network Block ---
[module/net]
type = internal/network
interface-type = wireless
interval = 3.0

format-connected = <label-connected>
format-connected-background = ${colors.net-bg}
format-connected-foreground = ${colors.net-fg}
format-connected-padding = 1
label-connected = "  %essid%"

format-disconnected = <label-disconnected>
format-disconnected-background = ${colors.alert-bg}
format-disconnected-foreground = ${colors.alert-fg}
format-disconnected-padding = 1
label-disconnected = "󰖪 "

# --- CPU Block ---
[module/cpu]
type = internal/cpu
interval = 2
format = <label>
; format-background = ${colors.cpu-bg}
; format-foreground = ${colors.cpu-fg}
format-padding = 1
label = "  󰻠 %percentage%% "

# --- Disk Space Block ---
[module/disk]
type = internal/fs
mount-0 = /
interval = 20

format-mounted = <label-mounted>
; format-mounted-background = ${colors.disk-bg}
; format-mounted-foreground = ${colors.disk-fg}
format-mounted-padding = 1
label-mounted = "  %free% "

# --- Memory Block ---
[module/memory]
type = internal/memory
interval = 2

format = <label>
; format-background = ${colors.mem-bg}
; format-foreground = ${colors.mem-fg}
format-padding = 1
label = " 󰧑 %gb_used% "

# --- Sound Block (with Pavucontrol Left-Click) ---
[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
; format-volume-background = ${colors.sound-bg}
; format-volume-foreground = ${colors.sound-fg}
format-volume-padding = 1
label-volume = "   %percentage%% "

format-muted = <label-muted>
; format-muted-background = ${colors.sound-bg}
format-muted-foreground = ${colors.sep}
format-muted-padding = 1
label-muted = "   "

click-left = pavucontrol &

# --- Bluetooth Block ---
[module/bluetooth]
type = custom/script
exec = bluetoothctl info 2>/dev/null | awk -F': ' '/Name:/ {name=$2} /Battery Percentage:/ {match($0, /\(([0-9]+)\)/, m); battery=m[1]"%"} END {if (name) print name (battery ? " " battery : ""); else print "Off"}'
interval = 5

format = <label>
; format-background = ${colors.bt-bg}
; format-foreground = ${colors.bt-fg}
format-padding = 1
label = " 󰂯 %output% "

# --- Battery Block ---
[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT1
adapter = ADP1
poll-interval = 5

format-charging = <label-charging>
; format-charging-background = ${colors.bat-bg}
; format-charging-foreground = ${colors.bat-fg}
format-charging-padding = 1
label-charging = " 󰁹 %percentage%% (%time%) "

format-discharging = <label-discharging>
; format-discharging-background = ${colors.bat-bg}
; format-discharging-foreground = ${colors.bat-fg}
format-discharging-padding = 1
label-discharging = " 󱊢 %percentage%% (%time%) "

format-full = <label-full>
; format-full-background = ${colors.bat-bg}
; format-full-foreground = ${colors.bat-fg}
format-full-padding = 1
label-full = " 󰁹 100% "

# --- Time / Date Block ---
[module/date]
type = internal/date
interval = 5

date = %a %m-%d-%Y %R %Z
date-alt = %a %b %d %R

format = <label>
; format-background = ${colors.time-bg}
format-foreground = ${colors.time-fg}
format-padding = 1
label = " %date% "
